[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analyst"
version = "0.1.0"
description = "Local data analyst for Copilot in VS Code: Excel/CSV exports and Sedona SQL"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
xls = ["xlrd>=2.0"]
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["analyst"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["src", "server", "agent", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
