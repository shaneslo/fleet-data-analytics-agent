name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        pandas: ["pandas>=2.1,<3", "pandas>=3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "${{ matrix.pandas }}"
      - name: Lint
        run: ruff check analyst tests
      - name: Test
        run: python -m pytest -q
      - name: Trusted Sedona queries are read-only
        shell: bash
        run: |
          shopt -s nullglob
          files=(context/sedona/queries/*.sql)
          if [ ${#files[@]} -eq 0 ]; then echo "no trusted queries yet"; exit 0; fi
          python -m analyst.sqlcheck "${files[@]}"
